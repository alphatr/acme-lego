name: Build-Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - name: "Checkout"
      uses: actions/checkout@v7

    - name: "Set up Go"
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true

    - name: "Build"
      run: |
        mkdir -p release
        go run build/main.go
        TAG="${GITHUB_REF##*/}"
        go build -trimpath -ldflags="-s -w" -o "release/lego-${TAG}-linux-x64" .
        GOOS=linux GOARCH=386 go build -trimpath -ldflags="-s -w" -o "release/lego-${TAG}-linux-x86" .
        GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release/lego-${TAG}-linux-arm64" .
        GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release/lego-${TAG}-darwin-x64" .
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release/lego-${TAG}-win-x64.exe" .
        GOOS=windows GOARCH=386 go build -trimpath -ldflags="-s -w" -o "release/lego-${TAG}-win-x86.exe" .

    - name: "Release"
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
